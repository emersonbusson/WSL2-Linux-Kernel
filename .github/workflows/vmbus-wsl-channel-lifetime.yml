name: WSL channel lifetime experiment

# Ordinary x86_64 WSL protocol evidence on disposable hosted Windows machines.
# Builds preserve the Microsoft module configuration. Runtime qualification
# requires exact running notes and the complete module inventory; no
# confidential transition is claimed.
on:
  push:
    branches: [vmbus-rescind-ack-investigation-20261005]
    paths:
      - drivers/hv/**
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: 'Existing kernel artifact run (empty builds both kernels)'
        type: string
        required: false
      candidate_source_commit:
        description: 'Exact candidate source commit when reusing kernel artifacts'
        type: string
        required: false
      runner_scope:
        description: 'Runner image scope'
        type: choice
        options: [both, windows-2025, windows-latest]
        default: both
      variant_scope:
        description: 'Protocol variant scope'
        type: choice
        options: [both, ack-candidate, retention-baseline]
        default: both

permissions:
  contents: read
  actions: read

concurrency:
  group: vmbus-upstream-global
  cancel-in-progress: false

jobs:
  kernel:
    if: ${{ inputs.kernel_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: ${{ inputs.variant_scope == 'ack-candidate' && fromJSON('["ack-candidate"]') || inputs.variant_scope == 'retention-baseline' && fromJSON('["retention-baseline"]') || fromJSON('["retention-baseline","ack-candidate"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.variant == 'retention-baseline' && 'f67a72ca25a54b58b9ae9b8dbeaed9b3c017a0bc' || github.sha }}
      - name: Build the exact WSL protocol kernel
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev qemu-utils
          mkdir -p protocol-out protocol-evidence
          git rev-parse HEAD > protocol-evidence/source-sha.txt
          cp Microsoft/config-wsl protocol-out/.config
          scripts/config --file protocol-out/.config \
            -e MODULES -d DEBUG_INFO -d DEBUG_INFO_BTF -e DEBUG_INFO_NONE \
            -d KUNIT -e KPROBES -e KPROBE_EVENTS -e FTRACE \
            -e HYPERV_VMBUS -e HYPERV_STORAGE -e HYPERV_VSOCKETS
          make O="$PWD/protocol-out" olddefconfig
          cp protocol-out/.config protocol-evidence/config
          test "$(sed -n '/^CONFIG_MODULES=y$/p' protocol-out/.config)" = 'CONFIG_MODULES=y'
          make O="$PWD/protocol-out" -j2 W=1 bzImage modules \
            2>&1 | tee protocol-evidence/build.log
          cp protocol-out/arch/x86/boot/bzImage protocol-evidence/kernel
          objcopy --dump-section .notes=protocol-evidence/kernel-notes.bin \
            protocol-out/vmlinux
          sha256sum protocol-evidence/kernel-notes.bin | cut -d' ' -f1 \
            > protocol-evidence/notes-sha256.txt
          make -s O="$PWD/protocol-out" kernelrelease \
            > protocol-evidence/kernel-release.txt
          readelf -n protocol-out/vmlinux > protocol-evidence/gnu-notes.txt
          make O="$PWD/protocol-out" INSTALL_MOD_PATH="$PWD/protocol-modules" \
            INSTALL_MOD_STRIP=1 modules_install
          make O="$PWD/protocol-out" INSTALL_HDR_PATH="$PWD/protocol-headers" headers_install
          mkdir -p protocol-perf
          kernel_release=$(cat protocol-evidence/kernel-release.txt)
          (cd "protocol-modules/lib/modules/$kernel_release" && \
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) \
            > protocol-evidence/modules.sha256
          Microsoft/scripts/gen_artifacts_vhdx.sh "$PWD/protocol-modules" \
            "$PWD/protocol-headers" "$PWD/protocol-perf" "$kernel_release" \
            "$PWD/protocol-evidence/modules.vhdx"
          (cd protocol-evidence && sha256sum kernel config kernel-notes.bin \
            source-sha.txt kernel-release.txt notes-sha256.txt \
            modules.vhdx modules.sha256 > SHA256SUMS)
      - name: Preserve kernel and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wsl-channel-kernel-${{ matrix.variant }}
          path: protocol-evidence/
          if-no-files-found: error
          retention-days: 90

  custom-module-pair:
    needs: kernel
    if: ${{ always() && (needs.kernel.result == 'success' || (needs.kernel.result == 'skipped' && inputs.kernel_run_id != '' && inputs.candidate_source_commit != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: ${{ inputs.variant_scope == 'ack-candidate' && fromJSON('["ack-candidate"]') || inputs.variant_scope == 'retention-baseline' && fromJSON('["retention-baseline"]') || fromJSON('["retention-baseline","ack-candidate"]') }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wsl-channel-kernel-${{ matrix.variant }}
          path: protocol-kernel
          run-id: ${{ inputs.kernel_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Package the exact modules for the custom kernelModules mount
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-utils
          (cd protocol-kernel && sha256sum -c SHA256SUMS)
          release=$(cat protocol-kernel/kernel-release.txt)
          [[ "$release" =~ ^[A-Za-z0-9._+-]+$ ]]
          parent_digest=$(sha256sum protocol-kernel/modules.vhdx | cut -d' ' -f1)
          qemu-img convert -O raw protocol-kernel/modules.vhdx protocol-raw.img
          mkdir protocol-artifacts protocol-module-layout
          debugfs -R "rdump / protocol-artifacts" protocol-raw.img
          test -f "protocol-artifacts/$release/modules/modules.dep"
          cp -a "protocol-artifacts/$release/modules/." protocol-module-layout/
          (cd protocol-module-layout && sha256sum -c ../protocol-kernel/modules.sha256)
          (cd protocol-module-layout && find . -type f -print0 | \
            LC_ALL=C sort -z | xargs -0 sha256sum) > protocol-module-inventory.sha256
          cmp protocol-module-inventory.sha256 protocol-kernel/modules.sha256
          # Custom kernelModules mounts the image root at /lib/modules/<release>.
          # The bundled artifacts image has an additional release/modules prefix.
          bytes=$(du -sb protocol-module-layout | cut -f1)
          blocks=$(( (bytes + 256 * 1024 * 1024 + 1023) / 1024 ))
          inodes=$(( $(find protocol-module-layout | wc -l) + 4096 ))
          mke2fs -q -d protocol-module-layout -N "$inodes" -b 1024 \
            -t ext4 protocol-custom-modules.img "$blocks"
          qemu-img convert -O vhdx protocol-custom-modules.img protocol-custom-modules.vhdx
          mv protocol-custom-modules.vhdx protocol-kernel/modules.vhdx
          printf '{"schema":1,"layout":"custom-module-root","parent_artifacts_vhdx_sha256":"%s","module_inventory_unchanged":true}\n' \
            "$parent_digest" > protocol-kernel/modules-layout.json
          (cd protocol-kernel && sha256sum kernel config kernel-notes.bin \
            source-sha.txt kernel-release.txt notes-sha256.txt \
            modules.vhdx modules.sha256 modules-layout.json > SHA256SUMS)
      - name: Preserve the exact custom module pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wsl-custom-module-pair-${{ matrix.variant }}
          path: protocol-kernel/
          if-no-files-found: error
          retention-days: 90
      - name: Clean owned packaging intermediates
        if: always()
        run: |
          rm -rf -- protocol-artifacts protocol-module-layout
          rm -f -- protocol-raw.img protocol-custom-modules.img \
            protocol-custom-modules.vhdx protocol-module-inventory.sha256

  ordinary-turnover:
    needs: custom-module-pair
    if: ${{ needs.custom-module-pair.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: ${{ inputs.runner_scope == 'windows-2025' && fromJSON('["windows-2025"]') || inputs.runner_scope == 'windows-latest' && fromJSON('["windows-latest"]') || fromJSON('["windows-2025","windows-latest"]') }}
        variant: ${{ inputs.variant_scope == 'ack-candidate' && fromJSON('["ack-candidate"]') || inputs.variant_scope == 'retention-baseline' && fromJSON('["retention-baseline"]') || fromJSON('["retention-baseline","ack-candidate"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wsl-custom-module-pair-${{ matrix.variant }}
          path: protocol-kernel
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify observation and refusal gates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force protocol-runtime | Out-Null
          $gate = 'FAIL'
          try {
            & 'Documentation/virt/hyperv/vmbus-ring-buffer-upstream-v2/drill/wsl-channel-lifetime-tests.ps1'
            $gate = 'PASS'
          } finally {
            @{ phase = 'harness-regressions'; verdict = $gate; source = $env:GITHUB_SHA } | ConvertTo-Json | Set-Content (Join-Path $PWD 'protocol-runtime/gate-status.json')
          }
      - name: Observe native WSL acknowledgments and physical backing
        shell: pwsh
        env:
          CANDIDATE_SOURCE_COMMIT: ${{ inputs.candidate_source_commit || github.sha }}
        run: |
          & 'Documentation/virt/hyperv/vmbus-ring-buffer-upstream-v2/drill/wsl-channel-lifetime.ps1' -KernelDirectory (Join-Path $PWD 'protocol-kernel') -OutputDirectory (Join-Path $PWD 'protocol-runtime') -Variant '${{ matrix.variant }}' -CandidateSourceCommit $env:CANDIDATE_SOURCE_COMMIT
      - name: Preserve all runtime observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wsl-channel-${{ matrix.variant }}-${{ matrix.runner }}
          path: protocol-runtime/
          if-no-files-found: error
          retention-days: 90
