name: VMBus upstream candidate

on:
  push:
    branches:
      - vmbus-ring-buffer-upstream-v2
  pull_request:
    paths:
      - .github/workflows/vmbus-upstream.yml
      - Documentation/virt/hyperv/vmbus-ring-buffer-upstream-v2/vmbus-ring-buffer-v2.patch
      - Documentation/virt/hyperv/vmbus-ring-buffer-upstream-v2/**
      - drivers/hv/channel.c
      - drivers/hv/channel_mgmt.c
      - drivers/hv/dxgkrnl/**
      - drivers/hv/hyperv_vmbus.h
      - drivers/hv/ring_buffer.c
      - drivers/hv/vmbus_drv.c
      - drivers/net/hyperv/netvsc.c
      - drivers/uio/uio_hv_generic.c
      - include/linux/hyperv.h
  workflow_dispatch:
    inputs:
      evidence_only:
        description: Validate and archive an operator report without rebuilding
        type: boolean
        default: false
      evidence_kind:
        description: Observation environment
        type: choice
        options:
          - local-wsl
          - coco
        default: local-wsl
      evidence_report:
        description: Sanitized JSON report; validation never proves a runner boot
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ inputs.evidence_only && format('vmbus-evidence-{0}', github.run_id) || 'vmbus-upstream-global' }}
  cancel-in-progress: false

jobs:
  wsl-backport:
    if: ${{ !inputs.evidence_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install kernel tools
        run: |
          set -euo pipefail
          mkdir -p vmbus-wsl-artifacts
          touch vmbus-wsl-artifacts/job-started.txt
          git rev-parse HEAD > vmbus-wsl-artifacts/source-sha.txt
          make kernelversion > vmbus-wsl-artifacts/kernel-version.txt
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev qemu-system-x86
          SPARSE_SHA=37156835e3d725b6d750f000be33ba3814bb2310
          git init sparse-src
          git -C sparse-src remote add origin https://git.kernel.org/pub/scm/devel/sparse/sparse.git
          git -C sparse-src fetch --depth=1 origin "$SPARSE_SHA"
          git -C sparse-src checkout --detach FETCH_HEAD
          make -C sparse-src -j2
          sudo install -m 0755 sparse-src/sparse /usr/local/bin/sparse
          echo /usr/local/bin >> "$GITHUB_PATH"
          export PATH="/usr/local/bin:$PATH"
          sparse --version
          mkdir -p vmbus-wsl-artifacts
          printf '%s\n' "$SPARSE_SHA" > vmbus-wsl-artifacts/sparse-source-sha.txt
      - name: Build WSL backport with W=1 and sparse
        run: |
          set -euo pipefail
          mkdir -p vmbus-wsl-artifacts
          make O="$GITHUB_WORKSPACE/wsl-out" x86_64_defconfig
          scripts/config --file wsl-out/.config \
            -e HYPERV -e HYPERV_VMBUS -e HYPERV_NET -e UIO \
            -e UIO_HV_GENERIC -e DXGKRNL
          make O="$GITHUB_WORKSPACE/wsl-out" olddefconfig
          cp wsl-out/.config vmbus-wsl-artifacts/config-x86_64
          grep -Eq '^CONFIG_DXGKRNL=[ym]$' wsl-out/.config
          make O="$GITHUB_WORKSPACE/wsl-out" -j2 W=1 C=2 CF=-D__CHECK_ENDIAN__ \
            drivers/hv/channel.o drivers/hv/channel_mgmt.o \
            drivers/hv/vmbus_drv.o drivers/hv/ring_buffer.o \
            drivers/net/hyperv/ drivers/uio/ \
            2>&1 | tee vmbus-wsl-artifacts/build-sparse.log
          grep -q 'CHECK .*vmbus_drv.c' vmbus-wsl-artifacts/build-sparse.log
          grep -q 'CHECK .*uio_hv_generic.c' vmbus-wsl-artifacts/build-sparse.log
          make O="$GITHUB_WORKSPACE/wsl-out" -j2 W=1 C=0 \
            drivers/hv/dxgkrnl/ \
            2>&1 | tee vmbus-wsl-artifacts/build-dxgkrnl.log
      - name: Run WSL backport KUnit lifetime tests
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/wsl-kunitconfig" <<'EOF'
          CONFIG_KUNIT=y
          CONFIG_HYPERVISOR_GUEST=y
          CONFIG_HYPERV=y
          CONFIG_HYPERV_VMBUS=y
          CONFIG_UIO=y
          CONFIG_UIO_HV_GENERIC=y
          CONFIG_HYPERV_VMBUS_KUNIT_TEST=y
          CONFIG_UIO_HV_GENERIC_KUNIT_TEST=y
          EOF
          cp "$RUNNER_TEMP/wsl-kunitconfig" \
            vmbus-wsl-artifacts/config-kunit-requested
          for case_name in \
            vmbus_gpadl_rescind_retains_state_test \
            vmbus_buffer_mapping_ref_defers_reencrypt_test \
            vmbus_vmalloc_mapping_ref_defers_free_test \
            vmbus_reclaim_busy_ref_defers_free_test \
            vmbus_buffer_cleanup_repeated_test; do
            grep -q "KUNIT_CASE($case_name)" drivers/hv/vmbus_buffer_test.c
          done
          for case_name in \
            hv_uio_unregister_wakes_reader_test \
            hv_uio_remove_disconnects_open_channel_test \
            hv_uio_mmap_validate_test \
            hv_uio_ring_mmap_page_range_test \
            hv_uio_mmap_page_protection_test; do
            grep -q "KUNIT_CASE($case_name)" drivers/uio/uio_hv_generic_mmap_test.c
          done
          if grep -q 'vmbus_set_chn_rescind_callback' drivers/uio/uio_hv_generic.c; then
            echo 'UIO must use ordinary device unregister on rescind'
            exit 1
          fi
          python3 tools/testing/kunit/kunit.py run \
            --build_dir="$GITHUB_WORKSPACE/wsl-kunit-out" \
            --arch=x86_64 --kunitconfig="$RUNNER_TEMP/wsl-kunitconfig" \
            2>&1 | tee vmbus-wsl-artifacts/kunit.log
          cp wsl-kunit-out/.config vmbus-wsl-artifacts/config-kunit-resolved
          grep -Eq 'hyperv-vmbus-gpadl-lifetime \(12 subtests\)' \
            vmbus-wsl-artifacts/kunit.log
          grep -Eq '\[PASSED\] hyperv-vmbus-gpadl-lifetime' \
            vmbus-wsl-artifacts/kunit.log
          grep -Eq 'hyperv-uio-hv-generic-mmap \(5 subtests\)' \
            vmbus-wsl-artifacts/kunit.log
          grep -Eq '\[PASSED\] hyperv-uio-hv-generic-mmap' \
            vmbus-wsl-artifacts/kunit.log
          grep -Eq 'Testing complete\. Ran 17 tests: passed: 17$' \
            vmbus-wsl-artifacts/kunit.log
          for case_name in \
            vmbus_gpadl_rescind_retains_state_test \
            vmbus_buffer_mapping_ref_defers_reencrypt_test \
            vmbus_vmalloc_mapping_ref_defers_free_test \
            vmbus_reclaim_busy_ref_defers_free_test \
            vmbus_buffer_cleanup_repeated_test; do
            grep -Eq "\\[PASSED\\] ${case_name}([[:space:]]|$)" \
              vmbus-wsl-artifacts/kunit.log
          done
          for case_name in \
            hv_uio_unregister_wakes_reader_test \
            hv_uio_remove_disconnects_open_channel_test \
            hv_uio_mmap_validate_test \
            hv_uio_ring_mmap_page_range_test \
            hv_uio_mmap_page_protection_test; do
            grep -Eq "\\[PASSED\\] ${case_name}([[:space:]]|$)" \
              vmbus-wsl-artifacts/kunit.log
          done
      - name: Upload WSL build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vmbus-wsl-backport
          path: vmbus-wsl-artifacts/
          if-no-files-found: error

  kernel:
    needs: wsl-backport
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: x86_64
            cross_compile: ""
          - arch: arm64
            cross_compile: aarch64-linux-gnu-
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install required kernel tools
        run: |
          set -euo pipefail
          mkdir -p vmbus-artifacts
          touch vmbus-artifacts/job-started.txt
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev gcc-aarch64-linux-gnu qemu-system-x86
          SPARSE_SHA=37156835e3d725b6d750f000be33ba3814bb2310
          git init sparse-src
          git -C sparse-src remote add origin https://git.kernel.org/pub/scm/devel/sparse/sparse.git
          git -C sparse-src fetch --depth=1 origin "$SPARSE_SHA"
          git -C sparse-src checkout --detach FETCH_HEAD
          make -C sparse-src -j2
          sudo install -m 0755 sparse-src/sparse /usr/local/bin/sparse
          echo /usr/local/bin >> "$GITHUB_PATH"
          export PATH="/usr/local/bin:$PATH"
          sparse --version
          mkdir -p vmbus-artifacts
          printf '%s\n' "$SPARSE_SHA" > vmbus-artifacts/sparse-source-sha.txt
          command -v aarch64-linux-gnu-gcc
      - name: Fetch fixed mainline base and apply candidate
        env:
          BASE: 93f51579e7df248780214094418f205253383cc5
        run: |
          set -euo pipefail
          mkdir -p vmbus-artifacts
          git init linux
          git -C linux remote add origin https://github.com/torvalds/linux.git
          git -C linux fetch --depth=1 origin "$BASE"
          git -C linux checkout --detach FETCH_HEAD
          test "$(git -C linux rev-parse HEAD)" = "$BASE"
          printf '%s\n' "$BASE" > vmbus-artifacts/base-sha.txt
          # checkpatch resolves Fixes tags even in this shallow checkout.
          # Fetch their exact objects without changing the candidate base.
          for fixes_sha in \
            e8b7db38449ac5b950a3f00519171c4be3e226ff \
            5b54dac856cb5bd6f33f4159012773e4a33704f7 \
            8b31f8c982b738e4130539e47f03967c599d8e22; do
            git -C linux fetch --depth=1 origin "$fixes_sha"
            test "$(git -C linux cat-file -t "$fixes_sha")" = commit
            printf '%s\n' "$fixes_sha" >> vmbus-artifacts/fixes-objects.txt
          done
          test "$(git -C linux rev-parse HEAD)" = "$BASE"
      - name: Configure candidate build
        env:
          ARCH: ${{ matrix.arch }}
          CROSS_COMPILE: ${{ matrix.cross_compile }}
        run: |
          set -euo pipefail
          make -C linux ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" O="$GITHUB_WORKSPACE/kernel-out" defconfig
          linux/scripts/config --file kernel-out/.config \
            -e HYPERV -e HYPERV_VMBUS -e HYPERV_NET -e UIO -e UIO_HV_GENERIC
          make -C linux ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" O="$GITHUB_WORKSPACE/kernel-out" olddefconfig
          cp kernel-out/.config vmbus-artifacts/config-${ARCH}
          (cd linux && test "$(scripts/checker-valid.sh sparse --arch="$ARCH" -m64)" = 1)
          grep -E '^CONFIG_(HYPERV|HYPERV_VMBUS|HYPERV_NET|UIO|UIO_HV_GENERIC)=' kernel-out/.config \
            | tee vmbus-artifacts/selected-config.txt
          for symbol in HYPERV HYPERV_VMBUS HYPERV_NET UIO UIO_HV_GENERIC; do
            grep -Eq "^CONFIG_${symbol}=[ym]$" kernel-out/.config
          done
      - name: Apply and build every patch in the series
        env:
          ARCH: ${{ matrix.arch }}
          CROSS_COMPILE: ${{ matrix.cross_compile }}
        run: |
          set -euo pipefail
          PATCH_DIR=Documentation/virt/hyperv/vmbus-ring-buffer-upstream-v2/series
          # Bind this run's evidence to the exact bytes that would be sent.
          # A build/checkpatch/KUnit PASS on different bytes is not evidence
          # about the sendable series.
          (cd "$PATCH_DIR" && sha256sum -c SHA256SUMS) \
            | tee vmbus-artifacts/series-byte-pin.log
          sha256sum "$PATCH_DIR"/*.patch > vmbus-artifacts/series-sha256.txt
          printf '%s\n' "$GITHUB_SHA" > vmbus-artifacts/series-commit-sha.txt
          # The 0000- cover letter ships in the same directory for git
          # send-email, but it is mail prose, not a diff, and git apply
          # rejects it with "No valid patches in input". SHA256SUMS pins only
          # 0001-0013, so the byte-pin above passes and the glob still reaches
          # it. Count the patches applied, not the files in the directory.
          stage=0
          for patch in "$PATCH_DIR"/*.patch; do
            case "$(basename "$patch")" in
            0000-*) continue ;;
            esac
            stage=$((stage + 1))
            git -C linux apply --check "$GITHUB_WORKSPACE/$patch"
            git -C linux apply "$GITHUB_WORKSPACE/$patch"
            # Intent-to-add so the files a patch creates enter the
            # working-tree diff. Without this the style gate cannot see
            # them: git apply leaves new files untracked and git diff
            # skips untracked paths, so a stage that adds a test file
            # used to report "0 warnings" about a file the gate never
            # read. Scope is the directories this series touches.
            git -C linux ls-files --others --exclude-standard -- \
              drivers/hv drivers/uio drivers/net/hyperv include/linux \
              | xargs -r -d '\n' git -C linux add -N --
            git -C linux diff --check
            if (cd linux && scripts/checkpatch.pl --strict --no-tree) \
              < <(git -C linux diff --no-ext-diff --no-color) 2>&1 \
              | tee "vmbus-artifacts/checkpatch-${stage}.log"; then
              :
            else
              check_status=("${PIPESTATUS[@]}")
              test "${check_status[0]}" -eq 1
              test "${check_status[1]}" -eq 0
            fi
            grep -Eq '^total: 0 errors, [01] warnings, 0 checks,' \
              "vmbus-artifacts/checkpatch-${stage}.log"
            errors=$(grep -c '^ERROR:' "vmbus-artifacts/checkpatch-${stage}.log" || true)
            warns=$(grep -c '^WARNING:' "vmbus-artifacts/checkpatch-${stage}.log" || true)
            test "$errors" -eq 0
            if [ "$warns" -gt 0 ]; then
              # The only permitted warning is FILE_PATH_CHANGES, and only
              # while the cumulative diff actually contains a new-file
              # entry. Any other warning, or this one without a new file,
              # fails the stage. Match the printed line at column 0 --
              # ': WARNING:' would match nothing.
              test "$warns" -eq 1
              grep -q '^WARNING: added, moved or deleted file(s)' \
                "vmbus-artifacts/checkpatch-${stage}.log"
              grep -q '^new file mode ' \
                <(git -C linux diff --no-ext-diff --no-color)
            fi
            # Per-mail shape: each format-patch is what gets sent, so each
            # is also checked on its own complete input. Exactly 0002,
            # 0010, 0012 and 0013 add files and carry that one warning.
            if (cd linux && scripts/checkpatch.pl --strict --no-tree) \
              < "$GITHUB_WORKSPACE/$patch" 2>&1 \
              | tee "vmbus-artifacts/checkpatch-mail-${stage}.log"; then
              :
            else
              check_status=("${PIPESTATUS[@]}")
              test "${check_status[0]}" -eq 1
              test "${check_status[1]}" -eq 0
            fi
            grep -Eq '^total: 0 errors, [01] warnings, 0 checks,' \
              "vmbus-artifacts/checkpatch-mail-${stage}.log"
            merrors=$(grep -c '^ERROR:' "vmbus-artifacts/checkpatch-mail-${stage}.log" || true)
            mwarns=$(grep -c '^WARNING:' "vmbus-artifacts/checkpatch-mail-${stage}.log" || true)
            test "$merrors" -eq 0
            case "$stage" in
            2 | 10 | 12 | 13)
              test "$mwarns" -eq 1
              grep -q '^WARNING: added, moved or deleted file(s)' \
                "vmbus-artifacts/checkpatch-mail-${stage}.log"
              ;;
            *)
              test "$mwarns" -eq 0
              ;;
            esac
          make -C linux ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            O="$GITHUB_WORKSPACE/kernel-out" -j2 W=1 C=2 CF=-D__CHECK_ENDIAN__ \
            drivers/hv/ drivers/net/hyperv/ drivers/uio/ \
            2>&1 | tee "vmbus-artifacts/build-${ARCH}-stage-${stage}.log"
          ! grep -q 'C=2 specified, but sparse is not available or not up to date' \
            "vmbus-artifacts/build-${ARCH}-stage-${stage}.log"
          done
          test "$stage" -eq 13
          for symbol in \
            vmbus_alloc_buffer \
            vmbus_free_buffer \
            vmbus_establish_gpadl \
            vmbus_establish_gpadl_caller_decrypted \
            vmbus_teardown_gpadl; do
            grep -q "EXPORT_SYMBOL_GPL($symbol)" linux/drivers/hv/channel.c
            grep -q "$symbol" linux/include/linux/hyperv.h
          done
      - name: Enforce CoCo static invariants
        run: |
          set -euo pipefail
          # Static negative proof of COCO-STATIC-PROOF.md: the guest-fatal
          # pattern Michael Kelley named (set_memory_decrypted() on a
          # vmalloc()/vmap() range) has no code path in any allocation this
          # series introduces. Machine-checked so it cannot regress silently.
          CHECKER=Documentation/virt/hyperv/vmbus-ring-buffer-upstream-v2/coco-static-invariants.py
          test -f "$CHECKER"
          python3 "$CHECKER" --tree linux | tee vmbus-artifacts/coco-static-invariants.log
          grep -q 'COCO-STATIC-PROOF: all invariants hold.' \
            vmbus-artifacts/coco-static-invariants.log

          # Gate self-test: a checker that only ever passes is not a checker.
          # Inject the exact rejected pattern and require the gate to reject it.
          cp linux/drivers/hv/channel.c "$RUNNER_TEMP/channel.c.bak"
          cp linux/drivers/uio/uio_hv_generic.c "$RUNNER_TEMP/uio_hv_generic.c.bak"
          restore_sources() {
            cp "$RUNNER_TEMP/channel.c.bak" linux/drivers/hv/channel.c
            cp "$RUNNER_TEMP/uio_hv_generic.c.bak" linux/drivers/uio/uio_hv_generic.c
          }
          trap restore_sources EXIT

          python3 - <<'PY'
          from pathlib import Path
          p = Path("linux/drivers/hv/channel.c")
          s = p.read_text()
          needle = "\t\tret = set_memory_decrypted((unsigned long)page_address(page),\n\t\t\t\t\t   1U << order);"
          assert needle in s, "allocator decrypt site not found"
          p.write_text(s.replace(needle,
              "\t\tret = set_memory_decrypted((unsigned long)buffer->addr,\n\t\t\t\t\t   1U << order);", 1))
          PY
          if python3 "$CHECKER" --tree linux; then
            echo "gate self-test FAILED: vmalloc decryption was not rejected" >&2
            exit 1
          fi
          echo "gate self-test OK: vmalloc decryption rejected"

          restore_sources

          python3 - <<'PY'
          from pathlib import Path
          p = Path("linux/drivers/uio/uio_hv_generic.c")
          s = p.read_text()
          needle = "hv_uio_probe(struct hv_device *dev,"
          assert needle in s
          p.write_text(s.replace(needle,
              "\tset_memory_decrypted((unsigned long)addr, n);\n" + needle, 1))
          PY
          if python3 "$CHECKER" --tree linux; then
            echo "gate self-test FAILED: UIO encryption transition was not rejected" >&2
            exit 1
          fi
          echo "gate self-test OK: UIO encryption transition rejected"

          restore_sources

          # The A1 shape: a compat teardown that hands decrypted pages back.
          # Dropping the re-encryption must be rejected, or the gate cannot
          # tell a restored contract from a silent regression.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("linux/drivers/hv/channel.c")
          s = p.read_text()
          needle = "\t\tencrypt_ret = set_memory_encrypted((unsigned long)gpadl->buffer,\n\t\t\t\t\t\t   PFN_UP(gpadl->size));"
          assert needle in s, "compat teardown encrypt site not found"
          p.write_text(s.replace(needle, "\t\tencrypt_ret = 0;", 1))
          PY
          if python3 "$CHECKER" --tree linux; then
            echo "gate self-test FAILED: missing compat re-encryption was not rejected" >&2
            exit 1
          fi
          echo "gate self-test OK: missing compat re-encryption rejected"

          restore_sources

          # KCA-04 shape: a clean direct-map declaration followed by a
          # reassignment to something that is not page_address(). A checker
          # that only reads declarations accepts this and then hands a
          # non-direct-map address to set_memory_encrypted(). Rejecting only
          # the spelling of the first write is not a gate.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("linux/drivers/hv/channel.c")
          s = p.read_text()
          needle = "\t\tunsigned int order = folio_order(page_folio(chunks[i]));\n"
          assert needle in s, "vmbus_free_buffer order declaration not found"
          p.write_text(s.replace(needle,
              needle + "\t\tvaddr = (unsigned long)addr;\n", 1))
          PY
          if python3 "$CHECKER" --tree linux; then
            echo "gate self-test FAILED: reassigned direct-map alias was not rejected" >&2
            exit 1
          fi
          echo "gate self-test OK: reassigned direct-map alias rejected"

          restore_sources
          trap - EXIT
          python3 "$CHECKER" --tree linux | tee -a vmbus-artifacts/coco-static-invariants.log
      - name: Require and run VMBus KUnit cases
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          for case_name in \
            vmbus_buffer_size_rounding_test \
            vmbus_buffer_size_overflow_test \
            vmbus_buffer_private_shared_selection_test \
            vmbus_ring_fallback_order_zero_test \
            vmbus_buffer_failed_teardown_leaks_test \
            vmbus_buffer_owner_reclaim_gate_test \
            vmbus_buffer_reclaim_schedule_gate_test \
            vmbus_buffer_rescind_retains_gpadl_test \
            vmbus_buffer_mapping_reference_test \
            vmbus_buffer_partial_allocation_cleanup_test \
            vmbus_buffer_repeated_owner_release_test \
            vmbus_gpadl_post_failure_test \
            vmbus_gpadl_post_success_test \
            vmbus_gpadl_response_state_test \
            vmbus_gpadl_teardown_post_failure_test \
            vmbus_buffer_order_zero_allocation_test \
            vmbus_requestor_alloc_free_test \
            vmbus_requestor_vmalloc_backing_test \
            vmbus_requestor_id_lifecycle_test \
            vmbus_requestor_invalid_ids_test \
            vmbus_requestor_exhaustion_test \
            hv_uio_unregister_wakes_reader_test \
            hv_uio_remove_disconnects_open_channel_test \
            hv_uio_ring_mmap_range_test \
            hv_uio_ring_mmap_prepare_test \
            hv_uio_mmap_region_select_test \
            hv_uio_mmap_prepare_test \
            hv_uio_pin_lifetime_test \
            hv_uio_pin_close_before_mapped_test \
            sysfs_ring_mmap_ops_have_no_close \
            uio_buffer_mmap_success \
            sysfs_mmap_prepare_failure_releases_pin \
            sysfs_mmap_partial_insert_failure_releases_pin \
            sysfs_mmap_release_during_insert_keeps_pages_alive \
            ring_mmap_release_preserves_protection_snapshot; do
            grep -R -q "KUNIT_CASE($case_name)" linux/drivers/hv linux/drivers/uio || {
              echo "Missing required KUnit case: $case_name" | tee -a vmbus-artifacts/kunit.log
              exit 1
            }
          done
          if grep -q 'vmbus_set_chn_rescind_callback' linux/drivers/uio/uio_hv_generic.c; then
            echo 'UIO must use ordinary device unregister on rescind'
            exit 1
          fi
          cat > linux/drivers/hv/.kunitconfig <<'EOF'
          CONFIG_KUNIT=y
          CONFIG_HYPERVISOR_GUEST=y
          CONFIG_HYPERV=y
          CONFIG_HYPERV_VMBUS=y
          CONFIG_UIO=y
          CONFIG_UIO_HV_GENERIC=y
          CONFIG_HYPERV_VMBUS_KUNIT_TEST=y
          CONFIG_UIO_HV_GENERIC_KUNIT_TEST=y
          CONFIG_NET=y
          CONFIG_INET=y
          CONFIG_NETDEVICES=y
          CONFIG_HYPERV_NET=y
          CONFIG_HYPERV_NET_KUNIT_TEST=y
          EOF
          (cd linux && python3 tools/testing/kunit/kunit.py run \
            --build_dir="$GITHUB_WORKSPACE/kunit-out" \
            --arch=x86_64 --kunitconfig=drivers/hv/.kunitconfig) \
            2>&1 | tee -a vmbus-artifacts/kunit.log
          grep -Eq 'hyperv-vmbus-buffer \(21 subtests\)' \
            vmbus-artifacts/kunit.log
          grep -Eq '\[PASSED\] hyperv-vmbus-buffer' \
            vmbus-artifacts/kunit.log
          grep -Eq 'hyperv-uio-mmap \(14 subtests\)' \
            vmbus-artifacts/kunit.log
          grep -Eq '\[PASSED\] hyperv-uio-mmap' \
            vmbus-artifacts/kunit.log
          grep -Eq 'Testing complete\. Ran 54 tests: passed: 54$' \
            vmbus-artifacts/kunit.log
          grep -Eq '\[PASSED\] hyperv-rndis-request' \
            vmbus-artifacts/kunit.log
          grep -Eq '\[PASSED\] hyperv-netvsc-completion' \
            vmbus-artifacts/kunit.log
          grep -Eq '\[PASSED\] netvsc_tx_complete_skb_success_test$' vmbus-artifacts/kunit.log
          grep -Eq '\[PASSED\] netvsc_tx_complete_skb_error_test$' vmbus-artifacts/kunit.log
          for case_name in \
            vmbus_buffer_size_rounding_test \
            vmbus_buffer_size_overflow_test \
            vmbus_buffer_private_shared_selection_test \
            vmbus_ring_fallback_order_zero_test \
            vmbus_buffer_failed_teardown_leaks_test \
            vmbus_buffer_owner_reclaim_gate_test \
            vmbus_buffer_reclaim_schedule_gate_test \
            vmbus_buffer_rescind_retains_gpadl_test \
            vmbus_buffer_mapping_reference_test \
            vmbus_buffer_partial_allocation_cleanup_test \
            vmbus_buffer_repeated_owner_release_test \
            vmbus_gpadl_post_failure_test \
            vmbus_gpadl_post_success_test \
            vmbus_gpadl_response_state_test \
            vmbus_gpadl_teardown_post_failure_test \
            vmbus_buffer_order_zero_allocation_test \
            vmbus_requestor_alloc_free_test \
            vmbus_requestor_vmalloc_backing_test \
            vmbus_requestor_id_lifecycle_test \
            vmbus_requestor_invalid_ids_test \
            vmbus_requestor_exhaustion_test \
            hv_uio_unregister_wakes_reader_test \
            hv_uio_remove_disconnects_open_channel_test \
            hv_uio_ring_mmap_range_test \
            hv_uio_ring_mmap_prepare_test \
            hv_uio_mmap_region_select_test \
            hv_uio_mmap_prepare_test \
            hv_uio_pin_lifetime_test \
            hv_uio_pin_close_before_mapped_test \
            sysfs_ring_mmap_ops_have_no_close \
            uio_buffer_mmap_success \
            sysfs_mmap_prepare_failure_releases_pin \
            sysfs_mmap_partial_insert_failure_releases_pin \
            sysfs_mmap_release_during_insert_keeps_pages_alive \
            ring_mmap_release_preserves_protection_snapshot; do
            grep -Eq "\\[PASSED\\] ${case_name}([[:space:]]|$)" \
              vmbus-artifacts/kunit.log
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vmbus-${{ matrix.arch }}
          path: vmbus-artifacts/
          if-no-files-found: error

  operator-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate the report and its stated scope
        env:
          REPORT: ${{ inputs.evidence_report }}
          KIND: ${{ inputs.evidence_kind }}
        run: |
          set -euo pipefail
          mkdir -p operator-evidence
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          text = os.environ['REPORT']
          if not text or len(text.encode()) > 65536:
              raise ValueError('missing or oversized report')
          Path('operator-evidence/report.json').write_text(text)
          PYTHON
          DOSSIER=Documentation/virt/hyperv/vmbus-ring-buffer-upstream-v2
          if [ "$KIND" = coco ]; then
            python3 -m pip install 'jsonschema==4.25.1'
            python3 "$DOSSIER/coco-validate.py" operator-evidence/report.json
          else
            python3 "$DOSSIER/test-kernel-pair-evidence.py"
            python3 "$DOSSIER/collect-kernel-pair-evidence.py" \
              --validate operator-evidence/report.json
          fi
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          p = Path('operator-evidence/report.json')
          report = json.loads(p.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Operator observation; schema validation is separate from runtime qualification.\n\n')
              summary.write('Environment: ' + os.environ['KIND'] + '\n\n')
              summary.write('Reported verdict: ' + str(report.get('verdict', 'see per-row results')) + '\n\n')
              summary.write('Report SHA-256: `' + hashlib.sha256(p.read_bytes()).hexdigest() + '`\n')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: operator-${{ inputs.evidence_kind }}-${{ github.run_id }}
          path: operator-evidence/report.json
          retention-days: 30
